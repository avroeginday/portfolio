<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Engineering Portfolio</title>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        background: #231F20;
        aspect-ratio: 16 / 9;
        /* Start smaller than full viewport so fullscreen button has room to grow */
        width: min(90vw, calc(90vh * 16 / 9));
        height: auto;
        max-width: 1920px;
        max-height: 1080px;
      }
      /* When in fullscreen, fill the screen at 16:9 */
      #unity-canvas:fullscreen {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <script src="Build/Build v2026.04.24.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        canvas.style.position = "fixed";
      }
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Build v2026.04.24.data",
        frameworkUrl: "Build/Build v2026.04.24.framework.js",
        codeUrl: "Build/Build v2026.04.24.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Vroeginday",
        productName: "Engineering Portfolio",
        productVersion: "2026.04",
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
